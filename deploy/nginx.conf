# /etc/nginx/sites-available/copro  (remplacer le nom de domaine)
server {
    listen 80;
    server_name 4ruedemoscou.fr www.4ruedemoscou.fr;

    client_max_body_size 32M;   # dépôt de documents jusqu'à 30 Mo

    location /static/ {
        alias /srv/copro/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# HTTPS : sudo certbot --nginx -d 4ruedemoscou.fr -d www.4ruedemoscou.fr
